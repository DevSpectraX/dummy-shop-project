<main class="min-h-screen flex flex-col items-center justify-center bg-[url(/assets/images/welcome-login.png)] bg-cover bg-no-repeat bg-bottom">
  @if (loginVM.loginState.isLoading()) {
    <div class="loader"></div>
  } @else if (loginVM.loginState.error(); as error) {
    <p>{{ error }}</p>
  } @else {
    <app-welcome-card (submitted)="loginVM.submit($event)"> </app-welcome-card>
    <button (click)="changeLanguage()"     class="text-text-inverse text-xs font-bold bg-info h-10 w-fit p-3 mt-6 rounded-[5px]"
>Change Language</button>
  }
</main>
